<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A2018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodina">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Rodina Riefler</title>
<style>
/* ===== Základ: aplikace přes celou obrazovku, obsah se posouvá jen uvnitř ===== */
:root{--h:36;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --p-T:#4A7FC1;--p-A:#D2617E;--p-S:#D99A2B;--p-O:#9268C7;--p-R:#3BA372;--p-M:#E0705A;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--kb:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#15110D;overscroll-behavior:none}
body{font-family:var(--sys);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
:where(.app) button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;margin:0;text-align:inherit}
:where(.app) input,:where(.app) textarea,:where(.app) select{font:inherit;font-size:16px;color:inherit}
[hidden]{display:none!important}
.app{position:fixed;inset:0;margin:0 auto;max-width:520px;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);background:var(--bgimg,var(--bg0));background-color:var(--bg0)}
@media (min-width:560px){.app{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 80px rgba(0,0,0,.5)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.num{font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.t{font-weight:650;overflow-wrap:anywhere}
.s{font-size:12.5px;color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow-wrap:anywhere}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ch h4{margin:0;font-size:13px;font-weight:700;color:var(--mut)}
.app .lnk{color:var(--acc-t);font-size:13px;font-weight:700;padding:6px 0;min-height:32px}
.list>.row{padding:10px 0;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0;padding-top:2px}
.time{font-weight:700;font-size:14px;width:46px;flex:none;font-variant-numeric:tabular-nums}
.app .chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--card2);white-space:nowrap;min-height:28px;display:inline-flex;align-items:center;gap:5px}
.app button.chip{min-height:36px;padding:6px 12px}
.app .chip.need{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;gap:3px}
.app .seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:13px;font-weight:700;color:var(--mut);min-height:40px;text-align:center}
.app .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.app .chk{width:44px;height:44px;margin:-8px -6px -8px -10px;flex:none;display:grid;place-items:center}
.chk>span{width:28px;height:28px;border-radius:9px;border:2px solid var(--mut);display:grid;place-items:center}
.chk svg{width:16px;height:16px;opacity:0}
.done .chk>span{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.done .chk svg{opacity:1}
.done .t{text-decoration:line-through;color:var(--mut)}
.app .ttxt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:2px 0;min-height:40px;text-align:left}
.desc{font-size:12.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.due{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--ink);white-space:nowrap}
.due.soon{color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn);background:transparent}
.empty{font-size:14px;color:var(--mut);padding:6px 0}
.app .btn{border-radius:16px;min-height:48px;padding:0 18px;font-weight:800;font-size:16px;background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.app .btn.sec{background:var(--card2);color:var(--ink)}
.app .btn.dang{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.app .btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:13px}
.inp{border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:14px;padding:11px 12px;width:100%;min-width:0}
textarea.inp{min-height:76px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:12px;font-weight:700;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app .tlink{font-size:13px;font-weight:650;color:var(--mut);align-self:flex-start;min-height:36px;padding:4px 0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.status svg{width:16px;height:16px;flex:none}
.status.ok{color:var(--good)} .status.warn{color:var(--warn)}
.pace{position:relative;height:14px;border-radius:99px;background:var(--card2)}
.pace i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,hsl(var(--h) 70% 62%),hsl(calc(var(--h) - 10) 60% 46%))}
.pace em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.pace-l{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:16px;overflow:hidden}
.kpis div{background:var(--card);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis small{font-size:12px;color:var(--mut);font-weight:600}
.kpis b{font-size:clamp(16px,4.8vw,19px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.donut-wrap{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:359px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:140px;height:140px}
.legend{display:flex;flex-direction:column;gap:7px;min-width:0;width:100%}
.legend .row{font-size:13px;gap:8px}
.legend b{font-variant-numeric:tabular-nums}
.legend .p{color:var(--mut);font-variant-numeric:tabular-nums;width:36px;text-align:right;flex:none}
.chart{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.chart text{font-size:10px;fill:var(--mut);font-family:var(--sys)}
.chart .lbl{fill:var(--ink);font-weight:700;font-size:11px}
.leg2{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut)}
.leg2 span{display:inline-flex;align-items:center;gap:6px}
.leg2 i{width:14px;height:0;border-top:2px solid currentColor;display:inline-block}
.catrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0;padding-top:0}
.catrow .bar{grid-column:2 / 4}
.catrow .sub{grid-column:2 / 4;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.fast{color:var(--warn);font-weight:700}
.tip{position:absolute;z-index:60;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:700;padding:6px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-125%)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.app .wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;min-height:60px}
.wd small{font-size:11px;opacity:.75;font-weight:700}
.wd b{font-size:17px;font-variant-numeric:tabular-nums}
.wd .dots{display:flex;gap:2px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:50%}
.wd.today b{text-decoration:underline;text-underline-offset:3px}
.app .wd[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.weekhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.app .arrow{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2)}
.arrow svg{width:18px;height:18px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.app .preset{flex:none;border-radius:14px;padding:9px 13px;background:var(--card2);display:flex;flex-direction:column;align-items:flex-start;min-height:48px;justify-content:center}
.preset b{font-size:14px;white-space:nowrap}
.preset span{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-size:16px}
.monthnav.mtop{padding:0 2px 10px}
[data-d="a"] .monthnav.mtop b{color:var(--hdr)}
.rc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rc:first-child{border-top:0;padding-top:0}
.rc .th{width:40px;height:40px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--mut);overflow:hidden}
.rc .th img{width:100%;height:100%;object-fit:cover}
.rc .th svg{width:20px;height:20px}
.clip{width:14px;height:14px;color:var(--mut);flex:none}
.daygrp{font-size:12px;font-weight:700;color:var(--mut);padding:12px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.sync{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.sync.ok i{background:var(--good)}
.banner{border-radius:16px;padding:12px 14px;background:var(--card2);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--acc-t)}
@media (prefers-reduced-motion:no-preference){
  .chk>span{transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .15s}
  .done .chk>span{transform:scale(1.08)}
  .sheet{animation:up .22s cubic-bezier(.2,.9,.3,1)}
  .shade{animation:fade .2s}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ===== Vzhled A: Zlatá skleněná ===== */
.app[data-d="a"][data-m="light"]{--card:rgba(255,253,249,.96);--card2:rgba(240,232,219,.96);--inp:#fff;--ink:#211A12;--mut:#6F6253;--line:rgba(60,45,25,.12);--acc:hsl(var(--h) 62% 46%);--acc-t:hsl(var(--h) 70% 29%);--on-acc:#fff;--warn:#B23F25;--good:#287A50;--tb:rgba(255,252,246,.78);--tb-ink:#2A2016;--tb-act:rgba(60,40,15,.1);--tb-line:rgba(255,255,255,.9);--scrim:rgba(240,232,220,.94);--sheet:#FFFCF7}
.app[data-d="a"][data-m="dark"]{--card:rgba(32,26,20,.92);--card2:rgba(58,48,37,.92);--inp:rgba(0,0,0,.25);--ink:#F4ECDF;--mut:#B6A891;--line:rgba(255,240,215,.11);--acc:hsl(var(--h) 75% 64%);--acc-t:hsl(var(--h) 80% 72%);--on-acc:#1E160C;--warn:#F08A6C;--good:#6CCB98;--tb:rgba(30,24,18,.66);--tb-ink:#F6EEDF;--tb-act:rgba(255,255,255,.16);--tb-line:rgba(255,255,255,.18);--scrim:rgba(18,14,10,.92);--sheet:#251E17;color-scheme:dark}
.app[data-d="a"][data-bg="espresso"]{--bg0:#2A2018;--bgimg:radial-gradient(120% 60% at 85% 0%,hsl(var(--h) 55% 38% / .9),transparent 60%),radial-gradient(90% 50% at 0% 30%,hsl(calc(var(--h) - 20) 45% 28% / .9),transparent 65%),linear-gradient(180deg,#352C22,#1C1611);--hdr:#FBF3E6;--hdr-m:#D9C9AE}
.app[data-d="a"][data-bg="krem"]{--bg0:#F3ECE0;--bgimg:radial-gradient(110% 50% at 90% 0%,hsl(var(--h) 85% 80% / .9),transparent 60%),radial-gradient(80% 45% at 0% 35%,hsl(calc(var(--h) + 20) 60% 88%),transparent 70%),linear-gradient(180deg,#F6F1E8,#EDE5D7);--hdr:#241D14;--hdr-m:#6F6253}
.app[data-d="a"][data-bg="pulnoc"]{--bg0:#0F1622;--bgimg:radial-gradient(110% 50% at 90% 0%,hsl(var(--h) 70% 45% / .55),transparent 60%),radial-gradient(90% 50% at 0% 40%,#1E3350,transparent 65%),linear-gradient(180deg,#121C2B,#0A0F18);--hdr:#EEF3FA;--hdr-m:#A8B6C9}
.app[data-d="a"][data-bg="zapad"]{--bg0:#3B1F2B;--bgimg:radial-gradient(100% 50% at 80% 0%,hsl(var(--h) 90% 60%),transparent 60%),radial-gradient(90% 60% at 0% 25%,#B8456A,transparent 65%),radial-gradient(80% 50% at 100% 80%,#3D2A6B,transparent 70%),linear-gradient(180deg,#5A2A3A,#24162A);--hdr:#FFF6EC;--hdr-m:#F1D6C4}
.app[data-d="a"][data-bg="bila"]{--bg0:#FFFFFF;--bgimg:none;--hdr:#1A1814;--hdr-m:#6B655C}
.app[data-d="a"][data-bg="papir"]{--bg0:#F8F5EF;--bgimg:linear-gradient(180deg,#FBF9F4,#F3EFE7);--hdr:#241D14;--hdr-m:#6F6253}
.app[data-d="a"][data-bg="mlha"]{--bg0:#EDF1F6;--bgimg:radial-gradient(110% 50% at 90% 0%,#D8E3F1,transparent 60%),linear-gradient(180deg,#F3F6FA,#E6EBF2);--hdr:#18202B;--hdr-m:#5D6B7C}
.app[data-d="a"][data-bg="svetla"]{--bg0:hsl(var(--h) 50% 93%);--bgimg:radial-gradient(110% 50% at 90% 0%,hsl(var(--h) 70% 84%),transparent 60%),linear-gradient(180deg,hsl(var(--h) 55% 95%),hsl(var(--h) 35% 88%));--hdr:hsl(var(--h) 40% 14%);--hdr-m:hsl(var(--h) 20% 36%)}
.app[data-d="a"][data-bg="syta"]{--bg0:hsl(var(--h) 40% 20%);--bgimg:radial-gradient(110% 55% at 85% 0%,hsl(var(--h) 60% 45%),transparent 60%),linear-gradient(180deg,hsl(var(--h) 40% 27%),hsl(var(--h) 35% 11%));--hdr:#FFF8EE;--hdr-m:hsl(var(--h) 30% 82%)}
.app[data-d="a"][data-bg="grafit"]{--bg0:#1D1F22;--bgimg:linear-gradient(180deg,#27292D,#141618);--hdr:#F2F3F5;--hdr-m:#A9AFB7}
.app[data-d="a"][data-bg="cerna"]{--bg0:#000;--bgimg:none;--hdr:#F5F5F5;--hdr-m:#A0A0A0}
/* na čistě bílém pozadí šedé karty, na černém a grafitovém neutrální tmavé */
.app[data-d="a"][data-m="light"][data-bg="bila"]{--card:#F4F3F0;--card2:#E8E6E1;--scrim:rgba(255,255,255,.94);--sheet:#FFFFFF;--tb:rgba(255,255,255,.86);--tb-line:rgba(0,0,0,.08)}
.app[data-d="a"][data-m="dark"][data-bg="cerna"]{--card:#151515;--card2:#252525;--line:rgba(255,255,255,.1);--scrim:rgba(0,0,0,.92);--sheet:#161616;--tb:rgba(22,22,22,.8)}
.app[data-d="a"][data-m="dark"][data-bg="grafit"]{--card:rgba(38,41,45,.95);--card2:rgba(56,60,65,.95);--line:rgba(255,255,255,.1);--scrim:rgba(18,19,21,.92);--sheet:#25282C}
[data-d="a"] .head{padding:calc(var(--sat) + 16px) 20px 14px;color:var(--hdr);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
[data-d="a"] .head h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1}
[data-d="a"] .head .d{font-size:13px;color:var(--hdr-m);font-weight:600;margin-bottom:5px}
.glass{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px -14px rgba(0,0,0,.5)}
[data-d="a"][data-lt="1"] .head .glass{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.9)}
[data-d="a"][data-bg="bila"] .head .glass{background:#F4F3F0;border-color:rgba(0,0,0,.06);box-shadow:none}
[data-d="a"][data-glass="off"] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--card);border-color:var(--line);color:var(--ink)}
[data-d="a"] .hbtns{display:flex;gap:8px;align-items:center}
.app .hchip{border-radius:99px;min-height:40px;padding:0 12px;display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:700;color:var(--hdr);white-space:nowrap;flex:none}
.app .hchip.ic{width:40px;padding:0;justify-content:center}
.hchip svg{width:19px;height:19px}
[data-d="a"] .body{padding:0 14px calc(var(--sab) + 120px);display:flex;flex-direction:column;gap:12px}
[data-d="a"] .card{box-shadow:0 1px 0 var(--line),0 12px 30px -22px rgba(0,0,0,.45)}
[data-d="a"] .tabbar{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 12px);display:flex;gap:10px;align-items:center;z-index:10}
[data-d="a"] .tabbar::before{content:"";position:absolute;left:-14px;right:-14px;bottom:calc(-12px - var(--sab));height:calc(150px + var(--sab));background:linear-gradient(180deg,transparent,var(--scrim) 68%);pointer-events:none;z-index:-1}
[data-d="a"] .pill{flex:1;border-radius:99px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;background:var(--tb);border:1px solid var(--tb-line);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px -12px rgba(0,0,0,.45)}
[data-d="a"][data-glass="off"] .pill{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
.app[data-d="a"] .pill button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--tb-ink);opacity:.75;border-radius:99px;min-height:52px}
[data-d="a"] .pill button svg{width:22px;height:22px}
[data-d="a"] .pill button[aria-current="page"]{opacity:1;background:var(--tb-act);color:var(--acc-t)}
[data-d="a"] .fab{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--on-acc);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -10px rgba(0,0,0,.55)}
[data-d="a"] .fab svg{width:28px;height:28px}

/* ===== Vzhled B: Klasické Espresso ===== */
.app[data-d="p"]{--bgimg:none}
.app[data-d="p"][data-m="light"]{--bg0:#F6F1E8;--card:#FFFDF8;--card2:#EFE7D9;--inp:#fff;--ink:#241D14;--mut:#6F6253;--line:#E4DACA;--acc:hsl(var(--h) 55% 54%);--acc-t:hsl(var(--h) 60% 30%);--on-acc:#241D14;--hero:hsl(var(--h) 22% 17%);--hdr:#F6F1E8;--hdr-m:#CDBFA8;--warn:#B23F25;--good:#287A50;--sheet:#FFFDF8}
.app[data-d="p"][data-m="dark"]{--bg0:#1A1510;--card:#261F18;--card2:#352B21;--inp:rgba(0,0,0,.25);--ink:#F3EADB;--mut:#B3A38B;--line:#3D3328;--acc:hsl(var(--h) 75% 70%);--acc-t:hsl(var(--h) 80% 74%);--on-acc:#241D14;--hero:hsl(var(--h) 22% 13%);--hdr:#F6F1E8;--hdr-m:#CDBFA8;--warn:#F08A6C;--good:#6CCB98;--sheet:#261F18;color-scheme:dark}

.chk{position:relative}

  .app .qcat,.app .cat,.app .opt,.app .pad button,.app .btn,.app .fab,.app .who button,.app .chips button{transition:transform .12s ease-out}
  .app .qcat:active,.app .cat:active,.app .opt:active,.app .pad button:active,.app .btn:active,.app .fab:active,.app .who button:active,.app .chips button:active{transform:scale(.95)}
  .pop .chk>span{animation:chkpop .5s cubic-bezier(.3,1.6,.5,1)}
  .pop .chk svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .3s .08s ease-out forwards}
  .pop .t{transition:color .3s}
  .burst{display:block;position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
  .burst b{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--acc);opacity:0;animation:burst .55s ease-out forwards}

  .toast:not([hidden]){animation:tin .3s cubic-bezier(.2,1.3,.4,1)}
  .tk svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .3s .12s ease-out forwards}
  .okc{animation:okin .4s cubic-bezier(.2,1.4,.4,1)}
  .okc circle{stroke-dasharray:146;stroke-dashoffset:146;animation:draw .45s ease-out forwards}
  .okc path{stroke-dasharray:36;stroke-dashoffset:36;animation:draw .3s .35s ease-out forwards}
}
@keyframes draw{to{stroke-dashoffset:0}}

@keyframes tin{from{transform:translateX(-50%) translateY(14px) scale(.92);opacity:0}to{transform:translateX(-50%);opacity:1}}
@keyframes okin{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

<script>

function nowDate(){const o=store.get(NOWKEY);return o?new Date(o):new Date();}

function addDays(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}

function diffDays(a,b){return Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);}
function daysInMonth(ym){const [y,m]=ym.split('-').map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate();}
const MONTHS=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];

const JMENA=['Nový rok|Karina|Radmila|Diana|Dalimil|Tři králové|Vilma|Čestmír|Vladan|Břetislav|Bohdana|Pravoslav|Edita|Radovan|Alice|Ctirad|Drahoslav|Vladislav|Doubravka|Ilona|Běla|Slavomír|Zdeněk|Milena|Miloš|Zora|Ingrid|Otýlie|Zdislava|Robin|Marika',

function recat(t){
  const n=norm(t.note);
  if(t.cat==='zabava')return /(dar|oblec|boty|bunda|tricko)/.test(n)?'obleceni':'volny';
  if(t.cat==='bydleni'&&/(drogerie|vybav|xxxlutz|ikea|nabyt|domacnost|uklid)/.test(n))return 'domacnost';
  if(t.cat==='zdravi'&&/(zavinov|plen|kocar|detsk|deti|olivi|sebast|kojen|miminko|pediatr)/.test(n))return 'deti';
  return CAT[t.cat]?t.cat:'volny';
}
function importBudget(src){
  /* src = data dnešní aplikace {plan, tx, labels}. Vrátí nový rozpočet a nic v src nemění. */
  const tx={};
  for(const [id,t] of Object.entries(src.tx||{})){const c=recat(t);tx[id]={...t,cat:c,cat0:t.cat};}
  const old=Object.fromEntries(Object.entries(src.plan||{}).map(([k,v])=>[k,+v.v||0]));
  const plan={...DEFAULT_PLAN};
  for(const k of Object.keys(old))if(plan[k]!==undefined)plan[k]=old[k];
  // Zábava se dělí na Volný čas a Oblečení a dárky, nové kategorie berou plán z průměru přeřazených útrat
  const z=old.zabava||0;plan.volny=Math.round(z/2/500)*500;plan.obleceni=z-plan.volny;
  const full=[...new Set(Object.values(tx).filter(t=>!t.del).map(t=>t.d.slice(0,7)))].filter(m=>m<today().slice(0,7));
  const avg=(cat,from)=>{if(!full.length)return 0;const s=Object.values(tx).filter(t=>!t.del&&t.cat===cat&&t.cat0===from&&full.includes(t.d.slice(0,7))&&t.fund!=='out').reduce((a,t)=>a+t.amt,0);return Math.round(s/full.length/500)*500;};
  plan.deti=Math.min(plan.zdravi,avg('deti','zdravi'));plan.zdravi-=plan.deti;
  plan.domacnost=Math.min(plan.bydleni,avg('domacnost','bydleni'));plan.bydleni-=plan.domacnost;
  const ts=Date.now(),P={};for(const k of Object.keys(plan))P[k]={v:plan[k],ts};
  const labels={};for(const [k,v] of Object.entries(src.labels||{}))if(CAT[k])labels[k]=v;
  return {plan:P,tx,labels};
}

    if(!ok(yy)){bad='Datum '+d+'. '+mo+'. neexistuje';return;}date=yy+'-'+pad(mo)+'-'+pad(d);};
  s=s.replace(new RegExp(L+'(\\d{1,2})\\.\\s?(\\d{1,2})\\.(?:\\s?(\\d{4}))?'+R,'u'),(m0,d,mo,y)=>{
    if(!y&&+mo>12&&+d<24&&+mo<60){time=pad(d)+':'+pad(mo);return ' ';} // „12.30.“ na konci věty je čas
    setDate(+d,+mo,y);return ' ';});
  if(!date&&!bad)s=s.replace(new RegExp(L+'(\\d{1,2})\\.\\s(\\d{1,2})'+R+'(?![.:]\\d)','u'),(m0,d,mo)=>{setDate(+d,+mo);return ' ';});
  s=s.replace(new RegExp(L+'(?:(?:v|ve|příští|pristi)\\s+)?(dnes|zítra|zitra|pozítří|pozitri|pondělí|pondeli|úterý|utery|středa|středu|streda|stredu|čtvrtek|ctvrtek|pátek|patek|sobota|sobotu|sobotě|sobote|neděle|neděli|nedele|nedeli)'+R,'giu'),(m0,w)=>{
    const k=norm(w);if(!date){if(k==='dnes')date=t0;else if(k==='zitra')date=addDays(t0,1);else if(k==='pozitri')date=addDays(t0,2);else{let dd=(DAYW[k]-dow(t0)+7)%7;if(dd===0)dd=7;date=addDays(t0,dd);}}return ' ';});
  if(!time)s=s.replace(new RegExp(L+'(?:(?:v|ve|od|o)\\s+)?(\\d{1,2})[:.](\\d{2})'+R+'(?!\\.\\d)','u'),(m0,h,mi)=>{if(+h<24&&+mi<60)time=pad(h)+':'+mi;else bad='Čas '+h+':'+mi+' neexistuje';return ' ';});
  if(!time&&!bad)s=s.replace(new RegExp(L+'(?:v|ve|od|o)\\s+(\\d{1,2})(?:\\s*(?:h|hod|hodin))?'+R+'(?![.:]\\d)','u'),(m0,h)=>{if(+h<24)time=pad(h)+':00';else bad='Čas '+h+':00 neexistuje';return ' ';});
  const n=norm(raw);
  const who=/olivi/.test(n)?'O':/sebast/.test(n)?'S':/(^|\s)ann/.test(n)?'A':/(^|\s)(thom|tomas)/.test(n)?'T':/(my dva|jen my|rande)/.test(n)?'M':'R';
  let title=s.replace(/\s[.,;]+(?=\s)/g,' ').replace(/\s+/g,' ').trim().replace(/(^|\s)(v|ve|od|o)$/i,'').replace(/[\s.,;]+$/,'').trim();
  return {title:title.charAt(0).toUpperCase()+title.slice(1),date:date||t0,time,who,bad};
}

async function loadWeather(){
  if(WX&&Date.now()-WX.at<30*60e3)return;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=50.08&longitude=14.42&current=temperature_2m,weather_code&daily=temperature_2m_max,weather_code&timezone=Europe%2FPrague&forecast_days=2',{signal:ctl.signal});clearTimeout(tm);
    if(!r.ok)return;const j=await r.json();WX={at:Date.now(),t:Math.round(j.current.temperature_2m),c:j.current.weather_code,tm:Math.round(j.daily.temperature_2m_max[1])};store.set('rodina.wx',JSON.stringify(WX));if(view==='dnes'&&!sheet)render(true);
  }catch(e){}
}

function kpis(s){return `<div class="kpis"><div><small>Na den do konce</small><b>${fmt(s.perDay)}</b></div><div><small>Zbývá celkem</small><b>${fmt(s.left)}</b></div><div><small>Odhad konce měsíce</small><b>${fmt(s.forecast)}</b></div><div><small>Pevné platby z plánu</small><b>${fmtN(Math.round(s.fixSp/1000))} / ${fmtN(Math.round(s.fixPlan/1000))} tis.</b></div></div>`;}
function donut(s){
  const items=DONUT.map(k=>({n:CAT[k].n,v:s.sp[k],c:CAT[k].c}));const rest=CATS.filter(c=>!DONUT.includes(c.k)).reduce((a,c)=>a+s.sp[c.k],0);items.push({n:'Ostatní',v:rest,c:'var(--mut)'});
  const tot=items.reduce((a,i)=>a+i.v,0);if(!tot)return '<div class="empty">V tomhle měsíci zatím nic.</div>';
  const r=56,C=2*Math.PI*r;let off=0;
  const arcs=items.filter(i=>i.v>0).map(i=>{const len=i.v/tot*C,a=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${i.c}" stroke-width="20" stroke-dasharray="${Math.max(.5,len-2.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" data-tip="${i.n}: ${fmt(i.v)}"/>`;off+=len;return a;}).join('');
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Rozdělení útrat podle kategorií">${arcs}<text x="70" y="68" text-anchor="middle" style="font-size:19px;font-weight:800;fill:var(--ink)">${tis(tot)}</text><text x="70" y="86" text-anchor="middle" style="font-size:11px;fill:var(--mut)">Kč utraceno</text></svg>
  <div class="legend">${items.map(i=>`<div class="row"><i class="dot" style="background:${i.c}"></i><span class="grow">${i.n}</span><b>${tis(i.v)}</b><span class="p">${Math.round(i.v/tot*100)} %</span></div>`).join('')}</div></div>`;
}
const W=300,H=150,PL=44,PR_=10,PT=12,PB=22;
const axis=v=>!v?'0':v>=1e6?fmtN(v/1e6*10)/10+' mil.':fmtN(v/1000)+' tis.';
function niceMax(v){const s=[20000,40000,60000,80000,100000,150000,200000,250000,300000,400000,500000];if(v*1.08<=500000)return s.find(x=>x>=v*1.08);const m=Math.pow(10,Math.floor(Math.log10(v*1.08)));return Math.ceil(v*1.08/m)*m;}
function burnup(s,ym){
  const cur=daily(ym),pm=prevMonth(ym),prev=daily(pm),dim=cur.length,cum=a=>a.reduce((r,v,i)=>(r.push((r[i-1]||0)+v),r),[]);
  const cc=cum(cur).slice(0,s.day),pc=cum(prev);const plan=Array.from({length:dim},(_,i)=>s.fixPlan+s.varPlan*(i+1)/dim);
  const ymax=niceMax(Math.max(s.plan,s.forecast,pc[pc.length-1]||0,cc[cc.length-1]||0));
  const x=d=>PL+(W-PL-PR_)*(d-1)/(dim-1),y=v=>PT+(H-PT-PB)*(1-v/ymax);
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(Math.min(i+1,dim)).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const ticks=[0,ymax/2,ymax].map(v=>`<line x1="${PL}" x2="${W-PR_}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${PL-6}" y="${y(v)+3}" text-anchor="end">${axis(v)}</text>`).join('');
  const xt=[1,10,20,dim].map(d=>`<text x="${x(d)}" y="${H-6}" text-anchor="middle">${d}.</text>`).join('');
  const last=cc[cc.length-1]||0,lx=x(Math.max(1,cc.length));
  return `<div class="leg2"><span style="color:var(--acc)"><i></i><b style="color:var(--ink)">${MSHORT[+ym.slice(5)-1]}</b></span><span style="color:var(--mut)"><i style="border-top-style:dashed"></i>${MSHORT[+pm.slice(5)-1]}</span><span style="color:var(--ink)"><i style="border-top-style:dotted;opacity:.6"></i>plán</span></div>
  <svg class="chart" id="burn" viewBox="0 0 ${W} ${H}" role="img" aria-label="Útraty v měsíci po dnech proti minulému měsíci a plánu">${ticks}${xt}
  <path d="${path(plan)}" fill="none" stroke="var(--ink)" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>
  ${pc.some(v=>v)?`<path d="${path(pc.slice(0,dim))}" fill="none" stroke="var(--mut)" stroke-width="1.5" stroke-dasharray="5 4"/>`:''}
  ${cc.length?`<path d="${path(cc)} L${lx} ${y(0)} L${x(1)} ${y(0)}Z" fill="var(--acc)" fill-opacity=".14"/><path d="${path(cc)}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`:''}
  ${s.isCur&&cc.length<dim?`<line x1="${lx}" y1="${y(last)}" x2="${x(dim)}" y2="${y(s.forecast)}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/><text x="${x(dim)}" y="${y(s.forecast)-7}" text-anchor="end">odhad ${tis(s.forecast)}</text>`:''}
  ${cc.length?`<circle cx="${lx}" cy="${y(last)}" r="5" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/><text class="lbl" x="${Math.min(lx+8,W-40)}" y="${y(last)+16}">${tis(last)}</text>`:''}
  <line id="burnX" x1="0" x2="0" y1="${PT}" y2="${H-PB}" stroke="var(--ink)" stroke-opacity=".35" visibility="hidden"/>
  <rect x="${PL}" y="${PT}" width="${W-PL-PR_}" height="${H-PT-PB}" fill="transparent" data-burn="${ym}"/></svg>`;
}
function monthsChart(ym){
  const ms=[];for(let i=5;i>=0;i--){const m=prevMonth(ym,i);const st=stats(m);if(st.total||m===ym)ms.push([m,st.total,st]);}
  const cur=stats(ym),plan=PLAN();const ymax=niceMax(Math.max(plan,...ms.map(x=>x[1]),cur.isCur?cur.forecast:0));
  const bw=Math.min(34,(W-PL-PR_)/ms.length-8),gap=ms.length>1?(W-PL-PR_-bw*ms.length)/(ms.length-1):0,y=v=>PT+(H-PT-PB)*(1-v/ymax);
  const bars=ms.map(([m,v,st],i)=>{const isC=m===ym&&st.isCur,bx=PL+(ms.length>1?i*(bw+gap):(W-PL-PR_-bw)/2),over=v>plan,hh=Math.max(0,y(0)-y(v));
    const fc=isC?`<rect x="${bx}" y="${y(st.forecast)}" width="${bw}" height="${Math.max(0,y(0)-y(st.forecast))}" rx="4" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="3 3"/>`:'';
    const bar=hh>4?`<path d="M${bx} ${y(0)} V${y(v)+4} q0 -4 4 -4 h${bw-8} q4 0 4 4 V${y(0)}Z" fill="${isC?'var(--acc)':over?'var(--warn)':'var(--mut)'}" fill-opacity="${isC?1:.55}" data-tip="${monthName(m)}: ${fmt(v)}${isC?', odhad '+fmt(st.forecast):''}${over?', nad plánem':''}"/>`:'';
    return `${fc}${bar}<text x="${bx+bw/2}" y="${H-6}" text-anchor="middle" ${m===ym?'class="lbl"':''}>${MSHORT[+m.slice(5)-1]}</text>${m===ym?`<text x="${bx+bw/2}" y="${y(isC?st.forecast:v)-5}" text-anchor="middle" class="lbl">${tis(isC?st.forecast:v)}</text>`:''}`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Útraty po měsících s čarou plánu">${[0,ymax/2,ymax].map(v=>`<line x1="${PL}" x2="${W-PR_}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${PL-6}" y="${y(v)+3}" text-anchor="end">${axis(v)}</text>`).join('')}
  ${bars}<line x1="${PL}" x2="${W-PR_}" y1="${y(plan)}" y2="${y(plan)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${PL+2}" y="${y(plan)-4}" class="lbl" style="font-size:10px">plán ${tis(plan)}</text></svg>
  <div class="leg2"><span><i style="border-top:8px solid var(--mut);opacity:.55;width:10px"></i>v plánu</span><span><i style="border-top:8px solid var(--warn);opacity:.55;width:10px"></i>nad plánem</span>${cur.isCur?'<span><i style="border-top:8px solid var(--acc);width:10px"></i>tento měsíc, čárkovaně odhad</span>':''}</div>`;
}
function catRows(s){return CATS.map(c=>{const p=planOf(c.k),v=s.sp[c.k],r=p?v/p:0,fast=s.isCur&&!c.fix&&p&&r>s.day/s.dim*1.6&&r<=1,over=p&&r>1;
  return `<div class="catrow"><i class="dot" style="background:${c.c}"></i><span class="t">${c.n}</span><span class="num t">${fmt(v)}</span><div class="bar"><i style="width:${Math.min(100,r*100)}%;background:${c.c}"></i></div>
  <div class="sub"><span>${over?'<span class="fast">přečerpáno o '+fmt(v-p)+'</span>':fast?'<span class="fast">rychlé tempo</span>':c.fund?'fond, odklad':c.fix?'pevné platby':p?'v plánu':'bez plánu'}</span><span>${p?'zbývá '+fmt(Math.max(0,p-v))+' z '+tis(p):''}</span></div></div>`;}).join('');}
function txList(ym){
  const tx=monthTx(ym).sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);if(!tx.length)return '<div class="empty">Žádné záznamy.</div>';
  let out='',last='';for(const t of (txAll?tx:tx.slice(0,60))){if(t.d!==last){out+=`<div class="daygrp">${dRel(t.d)}</div>`;last=t.d;}const c=CAT[t.cat]||CAT.volny;
    out+=`<button class="row" data-a="txedit" data-id="${t.id}" style="width:100%;padding:9px 0;border-top:1px solid var(--line);text-align:left"><i class="dot" style="background:${c.c}"></i><span class="grow"><span class="t" style="display:block">${esc(t.note||c.n)}</span><span class="s">${c.n}${t.fund==='out'?' · z fondu':''} · ${esc(t.who||'')}</span></span>${t.rc?I.clip:''}<span class="num t">${fmt(t.amt)}</span></button>`;}
  return out+(tx.length>60&&!txAll?`<button class="btn sec sm" data-a="txall" style="margin-top:10px">Zobrazit všech ${tx.length} záznamů</button>`:'');
}

/* ---------- Kalendář ---------- */
function vKal(){
  const t=today();const start=wk||addDays(t,-dow(t));const days=Array.from({length:7},(_,i)=>addDays(start,i));
  const strip=days.map(d=>{const evs=eventsOn(d);return `<button class="wd ${d===t?'today':''}" data-a="day" data-d="${d}" aria-pressed="${d===selDay}" aria-label="${dLong(d)}"><small>${DSHORT[dow(d)]}</small><b>${+d.slice(8)}</b><span class="dots">${[...new Set(evs.map(e=>e.who))].slice(0,4).map(w=>`<i style="background:var(--p-${w})"></i>`).join('')}</span></button>`;}).join('');
  const evs=eventsOn(selDay),hol=holiday(selDay);
  const up=[];for(let i=1;i<=14&&up.length<8;i++){const d=addDays(selDay,i);for(const e of eventsOn(d))if(up.length<8)up.push(evRow(e,dRel(d)));}
  const [y1,m1,d1]=start.split('-').map(Number),end=addDays(start,6);

  <div class="leg2">${['T','A','S','O','M','R'].map(w=>`<span><i class="dot" style="background:var(--p-${w});width:8px;height:8px"></i>${WHO[w]}</span>`).join('')}</div></div>
  <div class="card"><div class="ch"><h4>${dLong(selDay)}</h4><span class="mut">${hol?esc(hol):'svátek '+esc(nameDay(selDay))}</span></div><div class="list">${evs.map(e=>evRow(e)).join('')||'<div class="empty">Volný den.</div>'}</div><button class="btn sec sm" data-a="evnew" data-d="${selDay}" style="align-self:flex-start">${I.plus}Přidat na tento den</button></div>
  <div class="card"><div class="ch"><h4>Dalších 14 dní</h4></div><div class="list">${up.join('')||'<div class="empty">Nic dalšího.</div>'}</div></div>
  <div class="note" style="padding:0 6px">Testovací verze ukládá akce jen v telefonu. Propojení s Google kalendářem přijde po nasazení skriptu.</div>`;
}

  case 'evdel': if(!sheet.confirm||Date.now()-sheet.confirm<600){if(!sheet.confirm){sheet.confirm=Date.now();render(true);}break;}{const e=S.events[draft.id];e.del=true;e.ts=Date.now();persist();closeSheet();toast('Smazáno');}break;
  case 'evskip': {const e=S.events[draft.id];e.skip=[...(e.skip||[]),sheet.on];e.ts=Date.now();persist();closeSheet();toast('Zrušeno jen pro tento den');}break;
  case 'veze': {const e=S.events[d.id];openSheet({k:'veze',id:d.id,on:d.on,title:e?e.title:''});break;}
  case 'vezeset': {const k=sheet.id+'|'+sheet.on;S.veze[k]={v:d.v==='Nikdo'?'':d.v,ts:Date.now()};persist();closeSheet();toast(d.v==='Nikdo'?'Zatím nikdo':'Veze '+d.v,true);break;}
  case 'txall': txAll=true;render(true);break;
  case 'month': {txAll=false;const n=prevMonth(month,-(+d.n));if(n>today().slice(0,7))break;month=n;
    // přepínač měsíce je nahoře nad rychlým zápisem, takže zůstane pod prstem; vyrovnání pro jistotu, kdyby se nad ním něco změnilo
    const nav=$('.monthnav'),y0=nav?nav.getBoundingClientRect().top:0;render(true);
    const nav2=$('.monthnav'),sc=$('#sc');if(nav&&nav2&&sc)sc.scrollTop+=nav2.getBoundingClientRect().top-y0;break;}
  case 'pme': PR.me=d.v;savePrefs();render(true);break;
  case 'pstart': PR.start=d.v;savePrefs();render(true);toast(d.v==='zapis'?'Po otevření rovnou Peníze se zápisem útraty':'Po otevření přehled dne');break;
  case 'pd': PR.d=d.v;savePrefs();render(true);break;
  case 'pm': PR.m=d.v;savePrefs();render(true);break;
  case 'ph': PR.h=+d.v;savePrefs();render(true);break;
  case 'pbg': PR.bg=d.v;savePrefs();render(true);break;
  case 'pglass': PR.glass=d.v;savePrefs();render(true);break;
  case 'import': doImport();break;
  case 'export': openSheet({k:'export'});break;
  case 'copyexp': {const t=$('#expT');const done=()=>toast('Zkopírováno');if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast('Označeno, zkopíruj podržením');});else{t.select();toast('Označeno, zkopíruj podržením');}break;}
  case 'reset': openSheet({k:'reset'});break;
  case 'resetok': S=blank();store.set(KEY,JSON.stringify(S));closeSheet();toast('Testovací data smazána');break;
  case 'update': checkUpdate(true);break;
  case 'syncsave': syncSave();break;
  }
}
function evSync(){const g=id=>{const e=document.getElementById(id);return e?e.value:undefined;};const t=g('ev-t'),ti=g('ev-title'),dd=g('ev-d'),tm=g('ev-time');
  if(t!==undefined)draft.sentence=t;
  if(ti!==undefined)draft.title=ti;if(dd){if(draft.rep==='w')draft.start=dd;else draft.date=dd;}if(tm!==undefined)draft.time=tm;}
function addTask(x,list,owner,popis,due){const id=uid();S.tasks[id]={id,x:x.trim(),list,owner:owner||null,by:PR.me,popis:popis||'',due:due||'',done:false,ts:Date.now()};persist();haptic();return id;}

/* Načtení kopie dat (jen GET, žádný zápis do dnešní aplikace) */
let importing=false;
async function doImport(){
  if(importing)return;importing=true;toast('Načítám kopii dat…');
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),20000);
    const r=await fetch(SOURCE_URL,{method:'GET',signal:ctl.signal,cache:'no-store'});clearTimeout(tm);
    if(!r.ok)throw new Error('http '+r.status);const src=await r.json();if(!src||typeof src.tx!=='object')throw new Error('tvar');
    const b=importBudget(src);
    // ruční zápisy v testovací verzi (bez cat0 a mimo zdroj) zůstávají
    for(const [id,t] of Object.entries(S.budget.tx)){if(!b.tx[id]&&!t.cat0)b.tx[id]=t;else if(b.tx[id]&&(t.ts||0)>(b.tx[id].ts||0))b.tx[id]=t;} // vlastní úpravy a mazání jsou novější než kopie
    for(const [k,v] of Object.entries(S.budget.plan))if(S.imported&&(v.ts||0)>S.imported)b.plan[k]=v; // ručně upravený plán zůstává
    // nová kopie záměrně nahrazuje útraty (bez slučování se starou kopií), úkoly a akce zůstávají
    S.budget=b;S.imported=Date.now();if(!store.set(KEY,JSON.stringify(S)))toast('Telefon nemá místo na uložení');render(true);toast('Načteno '+Object.values(b.tx).filter(t=>!t.del).length+' záznamů');
  }catch(e){toast(e.name==='AbortError'?'Načítání trvá moc dlouho, zkus to znovu':'Kopii se nepodařilo načíst, zkontroluj signál');}
  finally{importing=false;}
}

/* Sdílení mezi telefony: celý stav jde do rodinného skriptu, ten sloučí po záznamech a vrátí výsledek.
   Při prvním propojení, když skript ještě nic nemá, se napřed načte celá historie z dnešního rozpočtu (jen GET). */
let syncCfg={u:'',k:''};try{Object.assign(syncCfg,JSON.parse(store.get(SKEY)||'{}'));}catch(e){}
const syncUrl=()=>SYNC_URL||syncCfg.u, syncOn=()=>!!(syncUrl()&&syncCfg.k);
let syncing=false,syncAgain=false,syncT=null,syncState='';
function syncSoon(){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(syncNow,1500);}
function syncLabel(){const u=$('#syncState');if(u)u.textContent=syncState;}
async function syncNow(first){
  if(!syncOn())return;if(syncing){syncAgain=true;return;}syncing=true;clearTimeout(syncT);
  try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);
    const {imported,...state}=S;
    const r=await fetch(syncUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:syncCfg.k,state}),signal:ctl.signal,cache:'no-store'});clearTimeout(tm);
    const o=await r.json();if(o.chyba)throw new Error(/klíč/i.test(o.chyba)?'klic':o.chyba);if(!o.budget||!o.tasks)throw new Error('tvar');
    const before=JSON.stringify(S),im=S.imported;S=mergeState(S,migrate(o));S.imported=im;store.set(KEY,JSON.stringify(S));
    const n=Object.values(S.budget.tx).filter(x=>!x.del).length;
    if(!n&&!S.imported&&first!=='po-importu'){syncing=false;await doImport();if(!S.imported)return;return syncNow(first==='connect'?'connect-po':'po-importu');}
    syncState='Propojeno, naposledy '+PRGT.format(nowDate());syncLabel();
    if(JSON.stringify(S)!==before&&!busy())render(true);
    if(/^connect/.test(first||''))toast('Propojeno, '+n+' záznamů');
  }catch(e){syncState=e.message==='klic'?'Špatný kód rodiny':e.name==='AbortError'||e instanceof TypeError?'Bez signálu, zkusím to později':'Skript odpověděl chybou';syncLabel();if(/^connect/.test(first||''))toast(syncState);}
  finally{syncing=false;if(syncAgain){syncAgain=false;syncSoon();}}
}
function syncSave(){const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  syncCfg={u:SYNC_URL?'':g('syncU'),k:g('syncK')};store.set(SKEY,JSON.stringify(syncCfg));
  if(!syncOn()){syncState='';render(true);toast('Propojení vypnuto');return;}
  syncState='Propojuji…';render(true);syncNow('connect');}

/* Účtenky: zmenšená fotka do IndexedDB, nahrání na Google Disk až po napojení skriptu */
function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q));};img.onerror=e=>{URL.revokeObjectURL(u);rej(e);};img.src=u;});}
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('rodina',1);r.onupgradeneeded=()=>r.result.createObjectStore('rc');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function saveReceipt(id,full,thumb){try{const db=await idb();const tx=db.transaction('rc','readwrite');tx.objectStore('rc').put({full,thumb,pending:1,at:Date.now()},id);}catch(e){}}

/* ---------- Události ---------- */
app.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled){e.preventDefault();act(el,e);return;}if(e.target.dataset&&e.target.dataset.burn)burnAt(e);});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.dataset.f==='task'){const q=$('#qt'),v=q.value.trim();if(!v)return;const map={me:['todo',PR.me],ot:['todo',other()],nakup:['nakup',null]}[taskTab];const p=$('#qp'),dd=$('#qd');addTask(v,map[0],map[1],p&&p.value.trim(),dd&&dd.value);more=false;render(true);const q2=$('#qt');if(q2)q2.focus({preventScroll:true});toast(taskTab==='nakup'?'Na seznamu':'Úkol přidán');}});
document.addEventListener('keydown',e=>{
  if(sheet&&e.key==='Tab'){const f=[...document.querySelectorAll('.sheet button,.sheet input,.sheet textarea')].filter(x=>!x.disabled&&x.offsetParent!==null);if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&(i===-1||i===f.length-1)){e.preventDefault();f[0].focus();}}}
  if(sheet&&sheet.k==='spend'&&!sheet.pick&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){if(/^[0-9]$/.test(e.key)){e.preventDefault();act({dataset:{a:'key',k:e.key}});return;}if(e.key==='Backspace'){e.preventDefault();act({dataset:{a:'key',k:'bs'}});return;}if(e.key==='Enter'){e.preventDefault();act({dataset:{a:'savespend'}});return;}}if(e.key==='Enter'&&e.target.id==='ev-t'){e.preventDefault();act({dataset:{a:'evsave'}});}if(e.key==='Escape'&&sheet)closeSheet();});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='hueR'){PR.h=+t.value;app.style.setProperty('--h',PR.h);savePrefs();}
  if(t.id==='ev-date'||t.id==='ev-d')draft._manualDate=1;if(t.id==='ev-time')draft._manualTime=1;});
app.addEventListener('change',e=>{const t=e.target;
  if(t.id==='hueR')render(true);
  if(t.dataset.plan){const v=Math.max(0,Math.round(+String(t.value).replace(/\D/g,'')||0));S.budget.plan[t.dataset.plan]={v,ts:Date.now()};persist();t.value=v;const tot=$('#plan .ch .mut');if(tot)tot.textContent='celkem '+fmt(PLAN());toast('Plán uložen');}
  if(t.id==='rcIn'&&t.files&&t.files[0]){syncDraftInputs();const f=t.files[0];Promise.all([shrink(f,1600,.72),shrink(f,240,.7)]).then(([full,thumb])=>{draft.rcFull=full;draft.rcThumb=thumb;render(true);}).catch(()=>toast('Fotku se nepodařilo načíst'));}
});
/* Popisky grafů */
function showTip(txt,cx,cy){const tip=$('#tip');if(!tip)return;const r=app.getBoundingClientRect();tip.textContent=txt;tip.hidden=false;tip.style.left=Math.min(r.width-80,Math.max(80,cx-r.left))+'px';tip.style.top=Math.max(40,cy-r.top)+'px';clearTimeout(tipT);tipT=setTimeout(hideTip,2500);}
function hideTip(){const tip=$('#tip');if(tip)tip.hidden=true;const l=$('#burnX');if(l)l.setAttribute('visibility','hidden');}
function burnAt(e){const svg=$('#burn');if(!svg)return;const ym=e.target.dataset.burn,dim=daysInMonth(ym),r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W;
  const d=Math.max(1,Math.min(dim,Math.round((sx-PL)/(W-PL-PR_)*(dim-1))+1)),xx=PL+(W-PL-PR_)*(d-1)/(dim-1),l=$('#burnX');l.setAttribute('x1',xx);l.setAttribute('x2',xx);l.setAttribute('visibility','visible');
  const c=daily(ym).slice(0,d).reduce((a,b)=>a+b,0),p=daily(prevMonth(ym)).slice(0,d).reduce((a,b)=>a+b,0),st=stats(ym);
  showTip(`${d}. den: ${d<=st.day?MSHORT[+ym.slice(5)-1]+' '+tis(c)+', ':''}${MSHORT[+prevMonth(ym).slice(5)-1]} ${tis(p)}`,r.left+xx/W*r.width,r.top+24);}
app.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;if(e.target.dataset&&e.target.dataset.burn){burnAt(e);return;}const t=e.target.closest('[data-tip]');if(t)showTip(t.dataset.tip,e.clientX,e.clientY);});
app.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;const t=e.target.closest('[data-tip]');if(t&&!(e.target.dataset&&e.target.dataset.burn))showTip(t.dataset.tip,e.clientX,e.clientY);});
/* Klávesnice na iPhonu: list se posune nad ni */
if(window.visualViewport){const vv=window.visualViewport;const f=()=>{const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);app.style.setProperty('--kb',(kb>80?kb:0)+'px');};vv.addEventListener('resize',f);vv.addEventListener('scroll',f);}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(PR.m==='auto')render(true);});
/* Změny z jiného okna se hned ukážou */
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const o=JSON.parse(e.newValue);if(o&&o.budget&&o.tasks){const im=Math.max(o.imported||0,S.imported||0);S=mergeState(migrate(o),S);S.imported=im;if(!sheet)render(true);}}catch(x){}});
/* Nový den bez zavření aplikace */
let lastDay=today();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(today()!==lastDay){lastDay=today();selDay=today();wk=null;month=today().slice(0,7);if(!sheet)render(true);}checkUpdate(false);loadWeather();syncNow();}});

/* ---------- Aktualizace: instalují se samy, ale nikdy uprostřed rozepsané věci ---------- */
let swReg=null,pendingReload=false,updState='';
function busy(){return !!sheet||(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName));}
function doReload(){if(busy()){pendingReload=true;return;}pendingReload=false;location.reload();}
function checkUpdate(manual){if(!swReg){if(manual)toast('Aktualizace jsou dostupné jen v nainstalované aplikaci');return;}
  if(manual){updState='Hledám novou verzi…';const u=$('#updState');if(u)u.textContent=updState;}
  swReg.update().then(()=>{if(manual&&!swReg.installing&&!swReg.waiting){updState='Máš nejnovější verzi';const u=$('#updState');if(u)u.textContent=updState;}}).catch(()=>{if(manual){updState='Bez signálu, zkusím to později';const u=$('#updState');if(u)u.textContent=updState;}});}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){updState='Nová verze připravená';doReload();}});});
  }).catch(()=>{});
}
/* Pojistka proti zaseknutí: chyba v kreslení nesmí nechat prázdnou obrazovku */
window.addEventListener('error',e=>{if(!app.innerHTML.trim()){app.innerHTML='<div style="padding:40px 20px;color:#fff;font-family:var(--sys)"><h2>Něco se pokazilo</h2><p>Zkus aplikaci zavřít a otevřít znovu.</p></div>';}});

/* Testovací háček pro automatické testy */
window.__rodina={get S(){return S;},set S(v){S=v;},PR,fn:{recat,importBudget,mergeState,stats,presets,recurring,parseEvent,nameDay,holiday,easter,eventsOn,today,addDays,dow,catRank,syncNow,render:()=>render(true)},ver:APP_VER};

/* ---------- Start ---------- */
try{render();}catch(e){console.error(e);app.innerHTML='<div style="padding:40px 20px;color:#fff">Aplikaci se nepodařilo spustit. Zkus ji zavřít a otevřít znovu.</div>';}
if(PR.start==='zapis'){view='penize';render();}
loadWeather();
syncNow();setInterval(()=>{if(document.visibilityState==='visible')syncNow();},90000);
</script>
